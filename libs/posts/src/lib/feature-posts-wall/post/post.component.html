@if (post(); as post) {
  <lib-avatar-circle class="size32" [avatarUrl]="post.author.avatarUrl"></lib-avatar-circle>

  <main class="post-body">
    <div class="post-header">
      <strong class="post__author">
        {{ post.author.firstName }} {{ post.author.lastName }}
        <!--<span class="post-created-at">{{ post.createdAt | date: 'HH:mm dd.MM.yyyy' }}</span>-->
        <span class="post-created-at">{{ post.createdAt | timeAgo }}</span>
      </strong>
    </div>

    <p class="medium-text">{{ post.content }}</p>

    <div class="post-counters">
      <span class="comment-amount">
        <svg icon="comment" class="svg16"></svg>
        <span class="comments-length">{{ comments().length }}</span>
      </span>
    </div>

    <div class="post__comments-wrapper">
      @for (comment of comments(); track comment.id) {
        <lib-comment [comment]="comment"></lib-comment>
      }
    </div>

    <lib-post-input (created)="onCommentCreated($event)" [isCommentInput]="true"></lib-post-input>
  </main>
}
