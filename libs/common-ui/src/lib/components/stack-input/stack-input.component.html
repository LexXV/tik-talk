<div class="tt-form-label">
  <label class="tt-form-label__text" for="stack-input">
    <ng-content></ng-content>
  </label>


  <div class="stack-control">
    @for (tech of value(); track tech; let i = $index) {
      <div class="skill-tag stack-tag">
        <button
          type="button"
          (click)="onTagDelete(i)"
          class="stack-btn__delete svg16"
        >
          <svg icon="cross" class="svg10"></svg>
        </button>
        {{ tech }}
      </div>
    }

    <input
      id="stack-input"
      [(ngModel)]="innerInput"
      [disabled]="disabled"
      type="text"
      class="stack-ghost-input"
      placeholder="Выберите"
      (blur)="onBlur()"
    >
  </div>
</div>
