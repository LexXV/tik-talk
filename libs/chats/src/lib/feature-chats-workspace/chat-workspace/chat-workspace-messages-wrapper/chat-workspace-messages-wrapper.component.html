<div #messagesWrapper class="messages-wrapper">
  @for (message of messages(); track message.id; let i = $index) {
    @if (isNewGroup(i)) {
      <div class="day-divider">
        {{ message.createdAt | chatDate }}
      </div>
    }

    <lib-chat-workspace-message [message]="message"></lib-chat-workspace-message>
  }
</div>

<lib-message-input (created)="onSendMessage($event)"></lib-message-input>
