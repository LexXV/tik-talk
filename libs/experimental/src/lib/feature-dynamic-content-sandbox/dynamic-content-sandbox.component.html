<h2 class="h1">Доска участников</h2>

<form [formGroup]="participantForm" (ngSubmit)="addParticipant()">
  <lib-tt-input formControlName="name" placeholder="">
    Имя
  </lib-tt-input>

  <lib-tt-input formControlName="role" placeholder="">
    Роль
  </lib-tt-input>

  <button type="submit" [disabled]="participantForm.invalid" class="btn">Добавить участника</button>
</form>

<hr>

<h2 class="participants-header" #h2>Список участников</h2>
