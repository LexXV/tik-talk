<div [formGroup]="form">
  <label class="tt-control-label mb16">
    Order Name
    <input
      formControlName="orderName"
      class="tt-input"
      type="text"
    >

    @if (orderName?.invalid &&
    (orderName?.touched || orderName?.dirty)) {
      <div style="color: red">
        Order Name is required
      </div>
    }
  </label>

  <label class="tt-control-label mb16">
    Physician
    <input
      formControlName="physician"
      class="tt-input"
      type="text"
    >
  </label>

  <label class="tt-control-label mb16">
    Priority
    <select class="tt-input" formControlName="priority">
      <option value="Routine">Routine</option>
      <option value="Urgent">Urgent</option>
      <option value="STAT">STAT</option>
    </select>
  </label>
</div>
