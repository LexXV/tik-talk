@if (chat(); as chat) {
  <app-avatar-circle
    class="size32"
    [avatarUrl]="chat.userFrom.avatarUrl"
  ></app-avatar-circle>

  <div class="last-message__wrapper medium-text">
    <div class="chat-info">
      <strong>{{ chat.userFrom.firstName }} {{ chat.userFrom.lastName }}</strong>
      <strong>{{ chat.createdAt | chatDate:'message' }}</strong>
    </div>
    <strong>{{ chat.message ?? '...' }}</strong>
  </div>
}
