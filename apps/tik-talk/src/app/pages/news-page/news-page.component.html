<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <h1 class="h1 mb60">Please enter the topic you are interested in:</h1>

  <div class="topic-input">
    <input
      formControlName="topic"
      class="tt-input mb32"
      type="text"
      placeholder="Enter the topic"
    />
  </div>

  <button class="btn mb16" type="submit">Submit</button>
</form>

@if (enteredTopic) {
  <h2>Submitted already: {{ enteredTopic }}</h2>
}
