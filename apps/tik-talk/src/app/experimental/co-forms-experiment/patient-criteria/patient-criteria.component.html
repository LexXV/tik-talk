<div [formGroup]="form">
  <label class="tt-control-label mb16">
    Patient Age
    <input formControlName="patientAge" class="tt-input" type="text" />
  </label>

  <label class="tt-control-label mb16">
    Patient Gender
    <select class="tt-input" formControlName="patientGender">
      <option value="">Select...</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
  </label>
</div>
